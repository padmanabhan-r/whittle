[project]
name = "costcutter"
version = "0.1.0"
description = "Whittle backend: finds and fixes token waste in AI agents"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "anyio>=4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["costcutter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
